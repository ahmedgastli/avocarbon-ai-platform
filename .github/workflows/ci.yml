name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x ./backend/mvnw

      - name: Build and Test Backend
        run: ./mvnw clean test
        working-directory: ./backend

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci --ignore-scripts
        working-directory: ./frontend

      - name: Build Frontend
        run: npm run build
        working-directory: ./frontend

  mcp:
    name: MCP Server Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './mcp-server/package-lock.json'

      - name: Install Dependencies
        run: npm ci --ignore-scripts
        working-directory: ./mcp-server

      - name: Validate TypeScript Compilation
        run: npm run typecheck
        working-directory: ./mcp-server

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend, mcp]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Backend Dockerfile
        run: docker build -t avocarbon-backend:ci ./backend

      - name: Validate Frontend Dockerfile
        run: docker build -t avocarbon-frontend:ci ./frontend

      - name: Validate MCP Dockerfile
        run: docker build -t avocarbon-mcp:ci ./mcp-server
